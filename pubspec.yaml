  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  share_plus: ^13.3.0
  flutter_stripe: ^10.1.1
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  google_mlkit_text_recognition: ^0.11.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
