name: colab
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.15.0
  speech_to_text: ^7.0.0
  supabase_flutter: ^2.17.1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  crypto: ^3.0.6
  bcrypt: ^1.1.3
